name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build + push backend image to GitHub Container Registry on every main push.
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date:YYYYMMDD}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest summary
        run: echo "Pushed ${{ steps.meta.outputs.tags }} @ ${{ steps.push.outputs.digest }}"

  # Optional deploy — only runs when production secrets are configured.
  # Supports two modes (set the matching secrets in repo Settings → Secrets):
  #
  # A) EC2 / VM via SSH  (matches server/start.sh production style)
  #    DEPLOY_SSH_KEY   — private key (PEM) for the host
  #    DEPLOY_HOST      — e.g. ec2-xx-xx-xx-xx.compute-1.amazonaws.com
  #    DEPLOY_USER      — e.g. ubuntu (default)
  #    DEPLOY_PATH      — e.g. /opt/dukaanlocker (default)
  #
  # B) AWS ECS Fargate
  #    AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  #    ECS_CLUSTER, ECS_SERVICE, ECS_TASK_FAMILY
  #
  # If neither set, this job is skipped (image still published).
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials (ECS)
        if: ${{ vars.DEPLOY_TARGET == 'ecs' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy to ECS
        if: ${{ vars.DEPLOY_TARGET == 'ecs' }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          if [ -z "${CLUSTER:-}" ] || [ -z "${SERVICE:-}" ] || [ -z "${ECS_TASK_FAMILY:-}" ]; then
            echo "::error::Set repo vars ECS_CLUSTER, ECS_SERVICE, ECS_TASK_FAMILY for ECS deploy."
            exit 1
          fi
          # Clone current task definition, swap image, register new revision, update service.
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json | python3 -c "
          import json, sys, os
          td = json.load(sys.stdin)
          image = os.environ['IMAGE'].splitlines()[0]
          for c in td.get('containerDefinitions', []):
              c['image'] = image
          for k in ('taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy','deregisteredAt'):
              td.pop(k, None)
          json.dump(td, sys.stdout)
          " > task-def.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_ARN"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "ECS service stable on $NEW_ARN"

      - name: Setup SSH (EC2 / VM)
        if: ${{ vars.DEPLOY_TARGET == 'ssh' || vars.DEPLOY_TARGET == '' }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "::notice::SSH deploy skipped — set DEPLOY_SSH_KEY secret and DEPLOY_HOST var (or ENABLE_DEPLOY=false)."
            echo "SKIP_SSH=true" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  IdentityFile ~/.ssh/deploy_key\n' > ~/.ssh/config
          echo "SKIP_SSH=false" >> "$GITHUB_ENV"

      - name: Deploy via SSH (docker pull + restart)
        if: ${{ (vars.DEPLOY_TARGET == 'ssh' || vars.DEPLOY_TARGET == '') && env.SKIP_SSH != 'true' }}
        env:
          SSH_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/dukaanlocker' }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::DEPLOY_HOST is required for SSH deploy."
            exit 1
          fi
          FIRST_TAG=$(echo "$IMAGE" | head -n1)
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          # Prefer compose if present; otherwise run the image directly.
          if [ -f docker-compose.prod.yml ]; then
            export BACKEND_IMAGE="${FIRST_TAG}"
            docker compose -f docker-compose.prod.yml pull backend || true
            docker compose -f docker-compose.prod.yml up -d
          else
            docker pull "${FIRST_TAG}"
            docker rm -f dukaanlocker-backend 2>/dev/null || true
            docker run -d --name dukaanlocker-backend \
              --restart unless-stopped \
              -p 8081:8081 \
              --env-file .env \
              "${FIRST_TAG}"
          fi
          echo "Deployed ${FIRST_TAG}"
          EOF

  # Build Android release APK as a CD artifact (unsigned debug-compatible assemble).
  android-release:
    name: Android assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukaanlocker-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
