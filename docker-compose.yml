services:
  # ─── MinIO (S3-compatible object storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: dukaanlocker-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # MinIO Console (browser UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - "minio-data:/data"
      - "/opt/dukaanlocker/backups/minio:/backups"  # backup write target
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MinIO bucket auto-init ───────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: dukaanlocker-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/${AWS_BUCKET_NAME:-dukaanlocker-documents} &&
        echo 'MinIO bucket ${AWS_BUCKET_NAME:-dukaanlocker-documents} ready'
      "

  # ─── Redis (secure document view token caching) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dukaanlocker-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "redis-data:/data"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL (production database) ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dukaanlocker-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dukaanlocker
      POSTGRES_USER: dukaanlocker
      POSTGRES_PASSWORD: dukaanlocker
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaanlocker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
  redis-data:
  postgres-data:
