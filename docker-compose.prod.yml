
services:
  postgres:
    image: postgres:16
    container_name: dukaanlocker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dukaanlocker
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dukaanlocker"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dukaanlocker-network

  redis:
    image: redis:7-alpine
    container_name: dukaanlocker-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dukaanlocker-network

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dukaanlocker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STORAGE_BASE_PATH: /app/Documents
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./Documents:/app/Documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dukaanlocker-network

volumes:
  postgres-data:
  redis-data:

networks:
  dukaanlocker-network:
    driver: bridge
