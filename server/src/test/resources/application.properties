# ---- Test-only overrides ----
# Intentionally using H2 in PostgreSQL compatibility mode for fast self-contained
# CI; production runs against PostgreSQL via ${DB_URL} (loaded by spring-dotenv).
#
# - In-memory H2 so tests don't need a Postgres instance.
# - Deterministic 32-byte (256-bit) JWT secret so HS256 JwtService init succeeds.
# - Disable multipart so existing tests aren't affected by the 6 MB ceiling.

spring.datasource.url=jdbc:h2:mem:dukaan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Tests use Hibernate (ddl-auto=create-drop) to build the schema, so Flyway
# must not run here — its V2 migration targets the pre-existing prod tables.
spring.flyway.enabled=false

server.port=0

spring.servlet.multipart.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=test-secret-which-is-exactly-thirty-two-bytes-long-1234567890
jwt.expiration-ms=86400000

# AWS config used by S3Service / TextractService / AwsS3Config / AwsTextractConfig.
# Defaulted to test-region/test-bucket so we don't have to wire ENV vars in CI.
aws.region=${AWS_REGION:test-region}
aws.bucketName=${AWS_BUCKET_NAME:test-bucket-name}

# Stub credentials so AwsS3Config / AwsTextractConfig are happy to construct clients lazily.
aws.accessKeyId=${AWS_ACCESS_KEY_ID:test-access-key}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:test-secret-key}

# Disable AWS autoconfig that probes real credentials at startup
spring.autoconfigure.exclude=\
  software.amazon.awssdk.services.s3.S3AutoConfiguration,\
  software.amazon.awssdk.services.textract.TextractAutoConfiguration

# Lower log noise during tests
logging.level.org.springframework.security=WARN
logging.level.com.shoplocker.fssai=INFO
