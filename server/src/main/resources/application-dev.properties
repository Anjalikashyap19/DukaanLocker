# ==========================
# Development Database (H2)
# ==========================

spring.datasource.url=jdbc:h2:mem:dukaan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Schema is Hibernate-managed in dev (ddl-auto=update); Flyway runs only in prod
# where it baselines the pre-existing Postgres schema and applies V2+.
spring.flyway.enabled=false

# SQL logging on for local development only
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI / OpenAPI docs — always enabled in dev profile so local development
# doesn't depend on the EXPOSE_DEVTOOLS env var being resolved.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Dev-tools exposure gate (H2 console, actuator) — still gated on EXPOSE_DEVTOOLS.
app.security.expose-devtools=true

# H2 web console is part of the dev-tools exposure gate. Set EXPOSE_DEVTOOLS=true
# to enable it locally (default off, so a prod instance that accidentally starts
# with the dev profile does NOT expose the console).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# MSME OTP login settings
# ==========================
# OTP length must match fast2sms.otp-length and the DLT template.
otp.length=6
# OTP validity — 10 minutes (must match fast2sms.otp-expiry-minutes).
otp.expiry-seconds=600
fast2sms.otp-length=6
fast2sms.otp-expiry-minutes=10