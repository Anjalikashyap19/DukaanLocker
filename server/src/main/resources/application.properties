# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# AWS
aws.region=${AWS_REGION:us-east-1}
aws.bucketName=${AWS_BUCKET_NAME:dukaanlocker-documents-local}

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai

# Server
server.port=8081

# Multipart Upload
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Spring Dotenv — loads .env from the project root (one level up from server/)
spring.dotenv.location=../.env

# Public Base URL
app.external-url=${EXTERNAL_URL:http://localhost:8081}

# JWT
jwt.secret=${JWT_SECRET:dk-dev-default-secret-minimum-32-characters-long-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Ola Maps
ola-maps.api-key=${OLA_MAPS_API_KEY:}
ola-maps.base-url=${OLA_MAPS_BASE_URL:https://api.olamaps.io}