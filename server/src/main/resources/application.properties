# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# NOTE: JWT_SECRET must be provided via environment / .env (no default — fail fast).

# AWS (kept for backward compatibility / MinIO support)
aws.region=${AWS_REGION:us-east-1}
aws.bucketName=${AWS_BUCKET_NAME:dukaanlocker-documents-local}
aws.endpoint=${AWS_ENDPOINT:}

# Local Storage (primary for VPS deployment)
storage.base-path=${STORAGE_BASE_PATH:/opt/dukaanlocker/Documents}

# OCR Provider: "tesseract" (self-hosted, free) or "textract" (AWS, paid)
app.ocr.provider=${APP_OCR_PROVIDER:tesseract}

# JPA — SQL logging off by default (enable in application-dev.properties)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai

# Server
server.port=8081

# Multipart Upload
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Swagger / OpenAPI — exposed only when EXPOSE_DEVTOOLS=true (default off).
# Even with the dev profile active, prod must set EXPOSE_DEVTOOLS=false.
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${EXPOSE_DEVTOOLS:false}
springdoc.swagger-ui.enabled=${EXPOSE_DEVTOOLS:false}

# Dev-tools exposure gate (H2 console, Swagger/OpenAPI, actuator) — default OFF.
# Local developers set EXPOSE_DEVTOOLS=true (in .env or environment).
app.security.expose-devtools=${EXPOSE_DEVTOOLS:false}

# Spring Dotenv — loads .env from the project root (one level up from server/)
spring.dotenv.location=../.env

# Public Base URL
app.external-url=${EXTERNAL_URL:http://localhost:8081}

# JWT — no default secret: JwtService fails fast if JWT_SECRET is unset/short.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Google Sign-In
app.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}

# Ola Maps
ola-maps.api-key=${OLA_MAPS_API_KEY:}
ola-maps.base-url=${OLA_MAPS_BASE_URL:https://api.olamaps.io}

# Redis Configuration (for secure document view token caching)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# SSL/TLS Configuration for AWS ElastiCache (production)
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Lettuce Connection Pool (production tuning)
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms

# Secure Document View Token Configuration
app.document.view-token.ttl-seconds=15

# Fast2SMS (OTP SMS gateway for MSME login)
fast2sms.api-key=${FAST2SMS_API_KEY:}
fast2sms.sender-id=${FAST2SMS_SENDER_ID:}
fast2sms.template-id=${FAST2SMS_TEMPLATE_ID:}
fast2sms.otp-expiry-minutes=5
fast2sms.otp-length=6
fast2sms.base-url=https://www.fast2sms.com
# Fast2SMS DLT route (POST /dev/bulkV2, route=dlt) for the forgot-password OTP.
#   reset-message-id = DLT Message / Content Template ID
#   reset-entity-id   = DLT Principal Entity ID
# sender-id above is the DLT Sender ID shared by both routes.
fast2sms.reset-message-id=${FAST2SMS_RESET_MESSAGE_ID:}
fast2sms.reset-entity-id=${FAST2SMS_RESET_ENTITY_ID:}

# OTP settings
otp.length=6
otp.expiry-seconds=300
otp.max-attempts=5

# OTP send rate limiting (MSME login) — enforced by OtpRateLimitService in Redis.
# otp.max-attempts above is the WRONG-OTP ceiling per challenge; these three govern
# how often a new OTP may be sent to the same mobile number.
#   cooldown : minimum gap between two sends to the same number
#   max-sends: sends allowed inside the rolling window before the lockout trips
#   lockout  : hard block applied once max-sends is exceeded
# NOTE: resend-cooldown-seconds was previously read by OtpService but never defined
# in any properties file, so it silently fell back to the 30s @Value default.
otp.resend-cooldown-seconds=120
otp.max-sends=5
otp.lockout-seconds=600

# API Setu (GSTN Taxpayers Verification)
app.api-setu.x-api-key=${API_SETU_X_API_KEY:}
app.api-setu.x-client-id=${API_SETU_X_CLIENT_ID:}

# FSSAI verification (iadv.in tracker). Overridable per environment so a change
# of upstream host or path does not need a code change / rebuild. The trailing
# "?ln=" / "?lic_num=" are part of the URL because the license number is appended.
app.fssai.details-url=${FSSAI_DETAILS_API_URL:https://iadv.in/tracker/dist/lnchk.php?ln=}
app.fssai.license-url=${FSSAI_LICENSE_API_URL:https://iadv.in/tracker/dist/check-details.php?lic_num=}
# Referer the upstream expects, and the base URI used to resolve relative links
# when rendering the certificate PDF.
app.fssai.referer=${FSSAI_REFERER:https://iadv.in/}
app.fssai.pdf-base-uri=${FSSAI_PDF_BASE_URI:https://iadv.in/}

# Firebase Cloud Messaging
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:dukaanlocker}

# Logging
logging.level.com.shoplocker.fssai=INFO
logging.level.org.springframework.data.redis=WARN

# Missing-document drip: 3-5 sends per owner per day, one per due slot,
# with per-owner-per-day jitter so timings shift daily. Cron only evaluates;
# the scheduler decides which slots are due and unserved.
notification.missing-doc.slots=10:00,13:30,17:00,20:00
notification.missing-doc.jitter-minutes=45
notification.missing-doc.min-per-day=3
notification.missing-doc.max-per-day=5
notification.missing-doc.cron=0 */15 * * * *

# Expiry-alert escalation: stage reminders at T-30 / T-15 / T-7, then daily
# from 6 days before expiry until the expiry date, then daily for
# expired-max-days after it, then a slower repeat every expired-repeat-days so
# a long-expired document is never permanently ignored. This pass is restricted
# to waking hours so the daily countdown never fires at night.
notification.alert.cron=0 15 8-22 * * *
notification.alert.stage-days=30,15,7
notification.alert.expired-max-days=7
notification.alert.expired-repeat-days=14

# Catch-up pass for documents that are ALREADY past their expiry date. Runs 24/7
# so a licence uploaded as already-expired is reported within minutes at any hour
# instead of waiting for the daytime window above. Reuses the same dedupe keys as
# the main pass, so it cannot double-send, and it never emits the daily countdown
# stages - those stay on the waking-hours schedule.
notification.alert.catchup-cron=0 */30 * * * *