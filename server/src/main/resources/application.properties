# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# NOTE: JWT_SECRET must be provided via environment / .env (no default — fail fast).

# AWS (kept for backward compatibility / MinIO support)
aws.region=${AWS_REGION:us-east-1}
aws.bucketName=${AWS_BUCKET_NAME:dukaanlocker-documents-local}
aws.endpoint=${AWS_ENDPOINT:}

# Local Storage (primary for VPS deployment)
storage.base-path=${STORAGE_BASE_PATH:/opt/dukaanlocker/Documents}

# OCR Provider: "tesseract" (self-hosted, free) or "textract" (AWS, paid)
app.ocr.provider=${APP_OCR_PROVIDER:tesseract}

# JPA — SQL logging off by default (enable in application-dev.properties)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai

# Server
server.port=8081

# Multipart Upload
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Swagger / OpenAPI — exposed only when EXPOSE_DEVTOOLS=true (default off).
# Even with the dev profile active, prod must set EXPOSE_DEVTOOLS=false.
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${EXPOSE_DEVTOOLS:false}
springdoc.swagger-ui.enabled=${EXPOSE_DEVTOOLS:false}

# Dev-tools exposure gate (H2 console, Swagger/OpenAPI, actuator) — default OFF.
# Local developers set EXPOSE_DEVTOOLS=true (in .env or environment).
app.security.expose-devtools=${EXPOSE_DEVTOOLS:false}

# Spring Dotenv — loads .env from the project root (one level up from server/)
spring.dotenv.location=../.env

# Public Base URL
app.external-url=${EXTERNAL_URL:http://localhost:8081}

# JWT — no default secret: JwtService fails fast if JWT_SECRET is unset/short.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Google Sign-In
app.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}

# Ola Maps
ola-maps.api-key=${OLA_MAPS_API_KEY:}
ola-maps.base-url=${OLA_MAPS_BASE_URL:https://api.olamaps.io}

# Redis Configuration (for secure document view token caching)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# SSL/TLS Configuration for AWS ElastiCache (production)
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Lettuce Connection Pool (production tuning)
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms

# Secure Document View Token Configuration
app.document.view-token.ttl-seconds=15

# Fast2SMS (OTP SMS gateway for MSME login)
fast2sms.api-key=${FAST2SMS_API_KEY:}
fast2sms.sender-id=${FAST2SMS_SENDER_ID:}
fast2sms.template-id=${FAST2SMS_TEMPLATE_ID:}
fast2sms.otp-expiry-minutes=5
fast2sms.otp-length=6
fast2sms.base-url=https://www.fast2sms.com

# OTP settings
otp.length=6
otp.expiry-seconds=300
otp.max-attempts=5

# API Setu (GSTN Taxpayers Verification)
app.api-setu.x-api-key=${API_SETU_X_API_KEY:}
app.api-setu.x-client-id=${API_SETU_X_CLIENT_ID:}

# Firebase Cloud Messaging
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:dukaanlocker}

# Logging
logging.level.com.shoplocker.fssai=INFO
logging.level.org.springframework.data.redis=WARN

# Missing Document Notification Settings
notification.missing-doc.max-per-run=1
notification.missing-doc.min-interval-hours=24
notification.missing-doc.rotation-strategy=ROUND_ROBIN