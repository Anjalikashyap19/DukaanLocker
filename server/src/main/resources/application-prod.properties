# ==========================
# Production Database (PostgreSQL)
# ==========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Adopt the pre-existing non-empty schema: Flyway creates the schema history
# table and baselines the current DB at version 1. Versioned migrations (V2+)
# are then applied on top before Hibernate validates the model.
spring.flyway.baseline-on-migrate=true

# ==========================
# Dev tools exposure (DELIBERATE)
# ==========================
# Swagger UI / OpenAPI are exposed WITHOUT auth on the prod profile so the API
# can be exercised from a browser. This intentionally reopens security fix #9
# for Swagger: anyone can read the full endpoint and request/response schema.
# H2 console is NOT enabled here (spring.h2.console.enabled is dev-profile only)
# and actuator only exposes /actuator/health by default.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.security.expose-devtools=true