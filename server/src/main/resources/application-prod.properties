# ==========================
# Production Database (PostgreSQL)
# ==========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Adopt the pre-existing non-empty schema: Flyway creates the schema history
# table and baselines the current DB at version 1. Versioned migrations (V2+)
# are then applied on top before Hibernate validates the model.
spring.flyway.baseline-on-migrate=true

# ==========================
# Dev tools exposure
# ==========================
# Swagger UI / OpenAPI and the H2 console are gated behind EXPOSE_DEVTOOLS
# (default false in application.properties). To temporarily expose Swagger in
# a non-prod environment, set EXPOSE_DEVTOOLS=true explicitly — do NOT force
# it on for the prod profile.
# H2 console remains dev-profile only (spring.h2.console.enabled is not set here).
# Actuator only exposes /actuator/health by default.

# ==========================
# MSME OTP login settings
# ==========================
# Keys (FAST2SMS_API_KEY / FAST2SMS_SENDER_ID / FAST2SMS_TEMPLATE_ID) are
# supplied as environment variables at deploy time, NOT committed here.
otp.length=6
otp.expiry-seconds=600
fast2sms.otp-length=6
fast2sms.otp-expiry-minutes=10