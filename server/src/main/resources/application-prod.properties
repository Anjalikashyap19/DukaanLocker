# ==========================
# Production Database (PostgreSQL)
# ==========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Adopt the pre-existing non-empty schema: Flyway creates the schema history
# table and baselines the current DB at version 1. Versioned migrations (V2+)
# are then applied on top before Hibernate validates the model.
spring.flyway.baseline-on-migrate=true