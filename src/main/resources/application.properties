spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


aws.region=${AWS_REGION}
aws.bucketName=${AWS_BUCKET_NAME}


spring.jpa.properties.hibernate.format_sql=true

# JPA / Hibernate Configurations

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai



server.port=8081

# Multipart upload limits — must be slightly ABOVE our service-level 5 MB check
# so DocumentValidationService.validateFileFormat's `file.getSize() > 5 MB` is what
# rejects oversized uploads (with a proper invalid_file_format code).
# Without these, Tomcat's default 1 MB ceiling returns a 500 before our code runs.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Swagger / OpenAPI
# Pin both paths explicitly so the Swagger-UI bootstrap and any tooling
# (Postman, scripts) get deterministic URLs that won't drift if springdoc's
# defaults change. Springdoc 2.x auto-derives the UI's config URL from
# `api-docs.path`, so letting it auto-discover is the safe path -- do NOT
# additionally pin `springdoc.swagger-ui.path` or
# `springdoc.swagger-ui.config-url`, or the generated swagger-config
# response loses its `urls` array and the UI renders an empty page.
# - OpenAPI JSON spec     : <external-url>/v3/api-docs
# - Swagger UI            : <external-url>/swagger-ui/index.html
# - Swagger UI (redirect) : <external-url>/swagger-ui.html -> /swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Public base URL the Swagger UI's "Try it out" should hit. On EC2, override
# this with `EXTERNAL_URL=http://<ec2-public-ip>:8081` in `.env` -- or let
# `start.sh` auto-detect it via the AWS instance metadata service at
# 169.254.169.254. Defaults to `http://localhost:8081` so tunnel/local-dev
# keeps working unchanged. Surfaced as a Springdoc `Server` in OpenApiConfig.
app.external-url=${EXTERNAL_URL:http://localhost:8081}