spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


aws.region=${AWS_REGION}
aws.bucketName=${AWS_BUCKET_NAME}


spring.jpa.properties.hibernate.format_sql=true

# JPA / Hibernate Configurations

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai



# FSSAI Service Configuration
fssai.portal.url=https://foscos.fssai.gov.in/
fssai.scraper.timeout-seconds=60
fssai.download.path=downloads/fssai/

server.port=8081

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true