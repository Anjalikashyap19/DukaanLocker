spring.datasource.url=${DB_URL:-jdbc:postgresql://localhost:5432/dukaanlocker}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:-dukaanuser}
spring.datasource.password=${DB_PASSWORD:-Dukaan@123}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


aws.region=${AWS_REGION:-us-east-1}
aws.bucketName=${AWS_BUCKET_NAME:-dukaanlocker-documents-402705370705-us-east-1-an}

spring.jpa.properties.hibernate.format_sql=true

# JPA / Hibernate Configurations

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FSSAI Service Configuration
fssai.portal.url=https://foscos.fssai.gov.in/
fssai.scraper.timeout-seconds=60
fssai.download.path=downloads/fssai/

server.port=8081

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true