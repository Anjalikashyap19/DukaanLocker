# ---- Database Configuration ----
# Default: H2 in-memory for local development (no external DB needed)
# For PostgreSQL production, override via environment variables:
#   DB_URL=jdbc:postgresql://...
#   DB_USERNAME=...
#   DB_PASSWORD=...
# Or use the 'postgres' Spring profile (see application-postgres.properties)
spring.datasource.url=jdbc:h2:mem:dukaan;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console enabled for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

aws.region=${AWS_REGION:us-east-1}
aws.bucketName=${AWS_BUCKET_NAME:dukaanlocker-documents-local}

spring.jpa.properties.hibernate.format_sql=true

# JPA / Hibernate Configurations
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.scan.packages=com.shoplocker.fssai

server.port=8081

# Multipart upload limits — must be slightly ABOVE our service-level 5 MB check
# so DocumentValidationService.validateFileFormat's `file.getSize() > 5 MB` is what
# rejects oversized uploads (with a proper invalid_file_format code).
# Without these, Tomcat's default 1 MB ceiling returns a 500 before our code runs.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Public base URL the Swagger UI's "Try it out" should hit.
app.external-url=${EXTERNAL_URL:http://localhost:8081}

# JWT configuration — secret must be ≥32 chars for HS256
# Override via JWT_SECRET env var for production
jwt.secret=${JWT_SECRET:dk-dev-default-secret-minimum-32-characters-long-for-hs256}
jwt.expiration-ms=${jwt.expiration-ms:86400000}
